<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="Aplikasi Google Apps Script">

<title>Monitoring Kelas</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f5f5;
    }

    .app-container {
        width: 100%;
        height: 100vh;
        position: relative;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: white;
    }

    .loading {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: white;
        z-index: 10;
        transition: opacity 0.3s ease;
    }

    .loading-content {
        text-align: center;
    }

    .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 15px;

        border: 4px solid #e0e0e0;
        border-top: 4px solid #4285f4;

        border-radius: 50%;

        animation: spin 1s linear infinite;
    }

    .loading-text {
        font-size: 14px;
        color: #666;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .error {
        display: none;
        position: absolute;
        inset: 0;

        justify-content: center;
        align-items: center;

        background: white;

        padding: 30px;
        text-align: center;
    }

    .error-content {
        max-width: 500px;
    }

    .error h2 {
        margin-bottom: 10px;
        color: #333;
    }

    .error p {
        color: #666;
        line-height: 1.6;
    }

    .error a {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 18px;

        background: #4285f4;
        color: white;

        text-decoration: none;
        border-radius: 6px;
    }

    .error a:hover {
        background: #3367d6;
    }
</style>

</head><body><div class="app-container"><div class="loading" id="loading">

    <div class="loading-content">

        <div class="spinner"></div>

        <div class="loading-text">
            Memuat aplikasi...
        </div>

    </div>

</div>


<iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx0VS0828rwyUODhjBQmvAkHGR-5vHnXs3GGhP2BgNGZSG31AXzvtNSjV4Fmo4bK0zl/exec"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
</iframe>


<div class="error" id="error">

    <div class="error-content">

        <h2>Aplikasi tidak dapat dimuat</h2>

        <p>
            Aplikasi dapat ditampilkan.
            Silakan coba buka aplikasi secara langsung.
        </p>

        <a
            href="https://script.google.com/macros/s/AKfycbx0VS0828rwyUODhjBQmvAkHGR-5vHnXs3GGhP2BgNGZSG31AXzvtNSjV4Fmo4bK0zl/exec"
            target="_blank"
            rel="noopener noreferrer">
            Buka Aplikasi
        </a>

    </div>

</div>

</div><script>

    const iframe = document.getElementById("appFrame");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");


    iframe.addEventListener("load", function () {

        setTimeout(function () {

            loading.style.opacity = "0";

            setTimeout(function () {
                loading.style.display = "none";
            }, 300);

        }, 300);

    });


    setTimeout(function () {

        if (loading.style.display !== "none") {

            loading.style.opacity = "0";

            setTimeout(function () {
                loading.style.display = "none";
            }, 300);

        }

    }, 10000);


    window.addEventListener("message", function(event) {

        /*
         * Pesan dari Google Apps Script dapat diproses
         * di sini jika suatu saat diperlukan.
         */

    });

</script></body>
</html>
